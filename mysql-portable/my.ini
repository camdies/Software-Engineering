[mysqld]
# basedir / datadir — 由 start_mysql.bat 动态生成 my.ini.auto 覆盖
# 请勿直接修改此文件；使用 start_mysql.bat 启动
basedir=CURRENT_DIR
datadir=CURRENT_DIR/data

# 端口（与 config.ini 一致）
port=3306

# 字符集
character-set-server=utf8mb4
collation-server=utf8mb4_unicode_ci

# 默认存储引擎
default-storage-engine=INNODB

# 连接数
max_connections=50

# 允许从 localhost 之外的地址连接（如果需要局域网访问）
# bind-address=0.0.0.0

# 认证插件（MySQL 8.0 默认 caching_sha2_password，兼容旧客户端用 mysql_native_password）
authentication_policy=mysql_native_password

[client]
port=3306
default-character-set=utf8mb4

[mysql]
default-character-set=utf8mb4